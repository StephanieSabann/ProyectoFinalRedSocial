# Nginx: recibe el tráfico en el puerto 80/443 y lo pasa a Node (puerto 3000).
# Certbot agrega automáticamente el bloque HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO_AQUI www.DOMINIO_AQUI;

    # Hasta 10 fotos de 8 MB por publicación
    client_max_body_size 90m;

    # Compresión de texto (JS, CSS, JSON)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Archivos estáticos de React (tienen hash en el nombre: se pueden cachear mucho)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # el procesamiento con Sharp puede tardar unos segundos
    }
}
